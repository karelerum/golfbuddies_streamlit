<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #20352d;
  }
  .overview-card {
    width: 100%;
    border: 1px solid #d7e2d9;
    border-radius: 10px;
    background: #ffffff;
    box-sizing: border-box;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(32, 53, 45, 0.06);
  }
  .overview-scroll {
    width: 100%;
    overflow-x: auto;
  }
  table {
    width: 100%;
    min-width: 220px;
    border-collapse: separate;
    border-spacing: 0;
  }
  th,
  td {
    border-bottom: 1px solid #e4ebe3;
    border-right: 1px solid #e4ebe3;
    padding: 10px 8px;
    text-align: center;
    vertical-align: middle;
    box-sizing: border-box;
  }
  tr:last-child td,
  tr:last-child th { border-bottom: none; }
  th:last-child,
  td:last-child { border-right: none; }
  thead th {
    background: #e7f0e8;
    color: #183c34;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.15;
  }
  .row-label {
    position: sticky;
    left: 0;
    z-index: 1;
    width: 52px;
    min-width: 52px;
    background: #ffffff;
    color: #60736a;
    font-size: 12px;
    font-weight: 700;
    text-align: left;
  }
  thead .row-label {
    z-index: 2;
    background: #e7f0e8;
  }
  .player-name {
    display: inline;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .placement {
    display: inline;
    white-space: nowrap;
  }
  .score-value {
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
  }
  .strokes-value { font-size: 18px; }
  .par-value.under { color: #2f7758; }
  .par-value.over { color: #a66a2c; }
  .par-value.even { color: #52645b; }
  .empty-state {
    padding: 12px;
    text-align: center;
    color: #60736a;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function sendMessageToStreamlit(type, data) {
    const outboundData = Object.assign({ isStreamlitMessage: true, type }, data);
    window.parent.postMessage(outboundData, "*");
  }

  function setFrameHeight() {
    sendMessageToStreamlit("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
  }

  function formatPar(value) {
    const numberValue = Number(value);
    if (numberValue === 0) return "E";
    return numberValue > 0 ? `+${numberValue}` : String(numberValue);
  }

  function parClass(value) {
    const numberValue = Number(value);
    if (numberValue < 0) return "under";
    if (numberValue > 0) return "over";
    return "even";
  }

  function renderComponent(args) {
    const rows = Array.isArray(args.rows) ? args.rows : [];
    const root = document.getElementById("root");
    root.innerHTML = "";

    const card = document.createElement("div");
    card.className = "overview-card";

    if (rows.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Ingen publiserte slag ennå";
      card.appendChild(empty);
      root.appendChild(card);
      setFrameHeight();
      return;
    }

    const scroll = document.createElement("div");
    scroll.className = "overview-scroll";
    const table = document.createElement("table");

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    const corner = document.createElement("th");
    corner.className = "row-label";
    corner.textContent = "";
    headRow.appendChild(corner);

    rows.forEach((row) => {
      const th = document.createElement("th");
      const placement = document.createElement("span");
      placement.className = "placement";
      placement.textContent = `${row.plassering}. `;
      const name = document.createElement("span");
      name.className = "player-name";
      name.title = row.spiller;
      name.textContent = row.spiller;
      th.appendChild(placement);
      th.appendChild(name);
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    const hasPoeng = rows.some((row) => row.poeng !== undefined && row.poeng !== null);
    if (hasPoeng) {
      const poengRow = document.createElement("tr");
      const poengLabel = document.createElement("th");
      poengLabel.className = "row-label";
      poengLabel.textContent = "Poeng";
      poengRow.appendChild(poengLabel);
      rows.forEach((row) => {
        const td = document.createElement("td");
        const value = document.createElement("div");
        value.className = "score-value strokes-value";
        const poengValue = Number(row.poeng);
        value.textContent = Number.isInteger(poengValue) ? String(poengValue) : poengValue.toFixed(1);
        td.appendChild(value);
        poengRow.appendChild(td);
      });
      tbody.appendChild(poengRow);
    }

    const parRow = document.createElement("tr");
    const parLabel = document.createElement("th");
    parLabel.className = "row-label";
    parLabel.textContent = "Par";
    parRow.appendChild(parLabel);
    rows.forEach((row) => {
      const td = document.createElement("td");
      const value = document.createElement("div");
      value.className = `score-value par-value ${parClass(row.spillers_par)}`;
      value.textContent = formatPar(row.spillers_par);
      td.appendChild(value);
      parRow.appendChild(td);
    });
    tbody.appendChild(parRow);

    const strokesRow = document.createElement("tr");
    const strokesLabel = document.createElement("th");
    strokesLabel.className = "row-label";
    strokesLabel.textContent = "Slag";
    strokesRow.appendChild(strokesLabel);
    rows.forEach((row) => {
      const td = document.createElement("td");
      const value = document.createElement("div");
      value.className = "score-value strokes-value";
      value.textContent = String(row.rundens_slag);
      td.appendChild(value);
      strokesRow.appendChild(td);
    });
    tbody.appendChild(strokesRow);
    table.appendChild(tbody);

    scroll.appendChild(table);
    card.appendChild(scroll);
    root.appendChild(card);
    setFrameHeight();
  }

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.type !== "streamlit:render") return;
    renderComponent(message.args || {});
  });

  window.addEventListener("load", () => {
    sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #20352d;
  }
  .overview-card {
    width: 100%;
    border: 1px solid #d7e2d9;
    border-radius: 10px;
    background: #ffffff;
    box-sizing: border-box;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(32, 53, 45, 0.06);
  }
  .overview-scroll {
    width: 100%;
    overflow-x: auto;
  }
  table {
    width: 100%;
    min-width: 220px;
    border-collapse: separate;
    border-spacing: 0;
  }
  th,
  td {
    border-bottom: 1px solid #e4ebe3;
    border-right: 1px solid #e4ebe3;
    padding: 10px 8px;
    text-align: center;
    vertical-align: middle;
    box-sizing: border-box;
  }
  tr:last-child td,
  tr:last-child th { border-bottom: none; }
  th:last-child,
  td:last-child { border-right: none; }
  thead th {
    background: #e7f0e8;
    color: #183c34;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.15;
  }
  .row-label {
    position: sticky;
    left: 0;
    z-index: 1;
    width: 110px;
    min-width: 110px;
    background: #ffffff;
    color: #60736a;
    font-size: 12px;
    font-weight: 700;
    text-align: left;
  }
  thead .row-label {
    z-index: 2;
    background: #e7f0e8;
  }
  .sync-button {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #24564a;
    font: 700 22px/1 -apple-system, Segoe UI, sans-serif;
    cursor: pointer;
  }
  .sync-button:hover { background: #d7e7da; }
  .sync-button:focus-visible {
    outline: 2px solid #24564a;
    outline-offset: 1px;
  }
  .player-name {
    display: inline;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .placement {
    display: inline;
    white-space: nowrap;
  }
  .score-value {
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
  }
  .par-value,
  .strokes-value { font-size: 16px; }
  .points-value { font-size: 22px; }
  .par-value.under { color: #2f7758; }
  .par-value.over { color: #a66a2c; }
  .par-value.even { color: #52645b; }
  .empty-state {
    padding: 12px;
    text-align: center;
    color: #60736a;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function sendMessageToStreamlit(type, data) {
    const outboundData = Object.assign({ isStreamlitMessage: true, type }, data);
    window.parent.postMessage(outboundData, "*");
  }

  function setFrameHeight() {
    sendMessageToStreamlit("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
  }

  function setComponentValue(value) {
    sendMessageToStreamlit("streamlit:setComponentValue", { value, dataType: "json" });
  }

  function formatPar(value) {
    const numberValue = Number(value);
    if (numberValue === 0) return "E";
    return numberValue > 0 ? `+${numberValue}` : String(numberValue);
  }

  function parClass(value) {
    const numberValue = Number(value);
    if (numberValue < 0) return "under";
    if (numberValue > 0) return "over";
    return "even";
  }

  function formatPoeng(value) {
    const numberValue = Number(value) || 0;
    return Number.isInteger(numberValue) ? String(numberValue) : numberValue.toFixed(1);
  }

  function renderComponent(args) {
    const rows = Array.isArray(args.rows) ? args.rows : [];
    const root = document.getElementById("root");
    root.innerHTML = "";

    const card = document.createElement("div");
    card.className = "overview-card";

    if (rows.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Ingen publiserte slag ennå";
      card.appendChild(empty);
      root.appendChild(card);
      setFrameHeight();
      return;
    }

    const scroll = document.createElement("div");
    scroll.className = "overview-scroll";
    const table = document.createElement("table");

    const hasPoeng = rows.some((row) => row.poeng !== undefined && row.poeng !== null);
    const columns = [];
    if (hasPoeng) {
      columns.push({ label: "Totalt poeng", key: "poeng", type: "poeng" });
      columns.push({ label: "Poeng", key: "dagens_poeng", type: "poeng" });
    }
    columns.push({ label: "Totalt par", key: "totalt_par", type: "par" });
    columns.push({ label: "Dagens par", key: "dagens_par", type: "par" });
    columns.push({ label: "Totalt slag", key: "totalt_slag", type: "strokes" });
    columns.push({ label: "Dagens slag", key: "dagens_slag", type: "strokes" });

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    const corner = document.createElement("th");
    corner.className = "row-label";
    const syncButton = document.createElement("button");
    syncButton.className = "sync-button";
    syncButton.type = "button";
    syncButton.textContent = "↻";
    syncButton.title = "Oppdater resultater";
    syncButton.setAttribute("aria-label", "Oppdater resultater");
    syncButton.addEventListener("click", () => {
      setComponentValue({ action: "sync", event_id: Date.now() });
    });
    corner.appendChild(syncButton);
    headRow.appendChild(corner);

    columns.forEach((column) => {
      const th = document.createElement("th");
      th.textContent = column.label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    rows.forEach((row) => {
      const tr = document.createElement("tr");
      const label = document.createElement("th");
      label.className = "row-label";
      const placement = document.createElement("span");
      placement.className = "placement";
      placement.textContent = `${row.plassering}. `;
      const name = document.createElement("span");
      name.className = "player-name";
      name.title = row.spiller;
      name.textContent = row.spiller;
      label.appendChild(placement);
      label.appendChild(name);
      tr.appendChild(label);

      columns.forEach((column) => {
        const td = document.createElement("td");
        const value = document.createElement("div");
        const rawValue = row[column.key];
        if (column.type === "poeng") {
          value.className = "score-value points-value";
          value.textContent = formatPoeng(rawValue);
        } else if (column.type === "par") {
          value.className = `score-value par-value ${parClass(rawValue)}`;
          value.textContent = formatPar(rawValue);
        } else {
          value.className = "score-value strokes-value";
          value.textContent = String(rawValue);
        }
        td.appendChild(value);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    card.appendChild(scroll);
    root.appendChild(card);
    setFrameHeight();
  }

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.type !== "streamlit:render") return;
    renderComponent(message.args || {});
  });

  window.addEventListener("load", () => {
    sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  });
</script>
</body>
</html>

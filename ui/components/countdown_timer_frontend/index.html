<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .golf-countdown-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    row-gap: 4px;
    flex-wrap: wrap;
    background: linear-gradient(135deg, #24564a, #183c34);
    border-radius: 10px;
    padding: 8px 26px 8px 12px;
    box-shadow: 0 2px 10px rgba(24, 60, 52, 0.25);
    box-sizing: border-box;
  }
  .golf-countdown-close {
    position: absolute;
    top: 4px;
    right: 6px;
    width: 16px;
    height: 16px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: #e7f0e8;
    font: 700 11px/1 -apple-system, Segoe UI, sans-serif;
    cursor: pointer;
  }
  .golf-countdown-close:hover { background: rgba(255, 255, 255, 0.25); }
  .golf-countdown-trophy { font-size: 18px; line-height: 1; }
  .golf-countdown-label {
    color: #e7f0e8;
    font-weight: 700;
    font-size: 0.72rem;
    margin-right: 2px;
    white-space: nowrap;
  }
  .golf-countdown-units { display: flex; gap: 6px; }
  .golf-countdown-unit { display: flex; flex-direction: column; align-items: center; min-width: 32px; }
  .golf-countdown-value {
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .golf-countdown-unit-label {
    color: #caa85e;
    font-size: 0.55rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .golf-countdown-done { color: #ffffff; font-size: 0.8rem; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  function sendMessageToStreamlit(type, data) {
    const outboundData = Object.assign({ isStreamlitMessage: true, type }, data);
    window.parent.postMessage(outboundData, "*");
  }

  function setFrameHeight() {
    sendMessageToStreamlit("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
  }

  function setComponentValue(value) {
    sendMessageToStreamlit("streamlit:setComponentValue", { value, dataType: "json" });
  }

  function pad(value) {
    return String(value).padStart(2, "0");
  }

  function renderComponent(args) {
    const { year, month, day, hour, minute, label } = args;
    const root = document.getElementById("root");
    const target = new Date(year, month - 1, day, hour, minute, 0).getTime();
    const doneText = label ? `${label} — I gang!` : "I gang!";

    function bindClose() {
      const closeButton = root.querySelector(".golf-countdown-close");
      closeButton.addEventListener("click", () => {
        setComponentValue({ action: "close" });
      });
    }

    function renderDone() {
      root.innerHTML = `
        <div class="golf-countdown-card">
          <button class="golf-countdown-close" type="button" title="Lukk" aria-label="Lukk">×</button>
          <span class="golf-countdown-trophy">🏆</span>
          <span class="golf-countdown-done">${doneText}</span>
        </div>
      `;
      bindClose();
      setFrameHeight();
    }

    function render(days, hours, minutes, seconds) {
      root.innerHTML = `
        <div class="golf-countdown-card">
          <button class="golf-countdown-close" type="button" title="Lukk" aria-label="Lukk">×</button>
          <span class="golf-countdown-trophy">🏆</span>
          <span class="golf-countdown-label">${label || ""}</span>
          <div class="golf-countdown-units">
            <div class="golf-countdown-unit"><span class="golf-countdown-value">${days}</span><span class="golf-countdown-unit-label">Dager</span></div>
            <div class="golf-countdown-unit"><span class="golf-countdown-value">${hours}</span><span class="golf-countdown-unit-label">Timer</span></div>
            <div class="golf-countdown-unit"><span class="golf-countdown-value">${minutes}</span><span class="golf-countdown-unit-label">Min</span></div>
            <div class="golf-countdown-unit"><span class="golf-countdown-value">${seconds}</span><span class="golf-countdown-unit-label">Sek</span></div>
          </div>
        </div>
      `;
      bindClose();
      setFrameHeight();
    }

    function tick() {
      const remaining = target - Date.now();
      if (remaining <= 0) {
        renderDone();
        return;
      }
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      render(pad(days), pad(hours), pad(minutes), pad(seconds));
    }

    tick();
    if (window.__golfCountdownInterval) {
      clearInterval(window.__golfCountdownInterval);
    }
    window.__golfCountdownInterval = setInterval(tick, 1000);
  }

  window.addEventListener("resize", setFrameHeight);

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.type !== "streamlit:render") return;
    renderComponent(message.args || {});
  });

  window.addEventListener("load", () => {
    sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  });
</script>
</body>
</html>
